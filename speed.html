<!DOCTYPE html>
<html lang="en" class="min-h-full bg-[#070913] text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper - Speed Run Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { 
      touch-action: manipulation; 
      -webkit-touch-callout: none; 
    }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #070913; }
    ::-webkit-scrollbar-thumb { background: #1e1b4b; border-radius: 4px; }

    #boardViewport {
      touch-action: pan-x pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
      overflow: auto;
    }

    .ms-cell {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      aspect-ratio: 1 / 1;
      font-weight: 800;
      font-size: 1.15rem;
      user-select: none;
      transition: background-color 0.1s, transform 0.05s;
    }

    .ms-unrevealed {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border-top: 2px solid #6366f1;
      border-left: 2px solid #6366f1;
      border-right: 2px solid #030712;
      border-bottom: 2px solid #030712;
      box-shadow: 0 0 6px rgba(99, 102, 241, 0.25);
    }
    
    .ms-unrevealed:active { transform: scale(0.93); background: #0f172a; }

    .ms-pressing {
      background: #831843 !important;
      border-color: #f43f5e !important;
      box-shadow: 0 0 16px #f43f5e !important;
      transform: scale(0.92);
    }

    .ms-revealed-zero {
      background: #0b0f19;
      border: 1px solid #111827;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.9);
    }

    .ms-revealed-num {
      background: #0d1322;
      border: 1px solid #1e1b4b;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.7);
    }

    .ms-void {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      aspect-ratio: 1 / 1;
      visibility: hidden;
      pointer-events: none;
    }

    .num-1 { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
    .num-2 { color: #4ade80; text-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
    .num-3 { color: #f87171; text-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
    .num-4 { color: #c084fc; text-shadow: 0 0 8px rgba(192, 132, 252, 0.4); }
    .num-5 { color: #fbbf24; }
    .num-6 { color: #2dd4bf; }
    .num-7 { color: #f472b6; }
    .num-8 { color: #94a3b8; }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between overflow-y-auto pb-20">

  <!-- Header -->
  <header class="bg-[#0b0f19] border-b border-indigo-950 px-4 py-2 flex items-center justify-between shadow-lg relative z-10">
    <div class="flex items-center gap-3">
      <a href="hub.html" class="px-3 py-1.5 rounded-lg bg-indigo-950/60 border border-indigo-800/50 hover:bg-indigo-900/80 text-indigo-300 hover:text-white transition text-xs font-bold flex items-center gap-1.5">
        <span>🎮</span> <span>All Modes</span>
      </a>
      <div>
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-fuchsia-400 to-indigo-400 drop-shadow">
          ⏱️ SPEED RUN MODE
        </h1>
        <p class="text-[10px] text-slate-400 font-bold">Race against the clock for best times & medals!</p>
      </div>
    </div>

    <button id="soundBtn" class="p-2 rounded-lg bg-indigo-950/60 border border-indigo-800/50 text-amber-400 hover:bg-indigo-900">
      <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
      <svg id="soundOffIcon" class="w-5 h-5 hidden text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
    </button>
  </header>

  <!-- DIFFICULTY SELECTION PANEL -->
  <div id="lobbyContainer" class="max-w-xl mx-auto w-full p-4 space-y-4 my-auto">
    <div class="bg-[#0b0f19] border border-indigo-900/80 rounded-2xl p-6 shadow-2xl space-y-6 text-center">
      <div class="space-y-1">
        <h2 class="text-2xl font-black text-white">Select Speed Run Tier</h2>
        <p class="text-xs text-indigo-300/70">Clear the board as fast as possible to earn medals!</p>
      </div>

      <div class="space-y-3">
        <select id="presetSelect" class="w-full bg-[#070913] border border-indigo-900 rounded-lg p-3 text-xs font-bold text-white">
          <option value="beginner">Beginner (9x9 - 10 Mines)</option>
          <option value="intermediate">Intermediate (16x16 - 40 Mines)</option>
          <option value="expert">Expert (16x30 - 99 Mines)</option>
          <option value="custom">Custom Configuration</option>
        </select>

        <div id="customInputs" class="hidden grid grid-cols-3 gap-2 text-xs">
          <input type="number" id="cRows" value="10" placeholder="Rows" class="bg-[#070913] border border-indigo-900 p-2 rounded text-white font-bold">
          <input type="number" id="cCols" value="10" placeholder="Cols" class="bg-[#070913] border border-indigo-900 p-2 rounded text-white font-bold">
          <input type="number" id="cMines" value="15" placeholder="Mines" class="bg-[#070913] border border-indigo-900 p-2 rounded text-white font-bold">
        </div>

        <button id="startSpeedRunBtn" class="w-full py-3 bg-gradient-to-r from-amber-500 via-fuchsia-600 to-indigo-600 hover:opacity-90 text-white font-black rounded-xl text-xs tracking-wider uppercase shadow-lg">
          Start Speed Run ⏱️
        </button>
      </div>
    </div>
  </div>

  <!-- GAMEPLAY AREA -->
  <main id="gameMain" class="hidden flex-1 flex flex-col items-center justify-start p-2 w-full">
    <div class="w-full max-w-lg bg-[#0b0f19] border border-indigo-900/50 rounded-xl p-2.5 mb-2 shadow-lg space-y-2 relative z-20">
      <div class="flex items-center justify-between text-sm font-black">
        <div class="flex items-center gap-1.5 bg-[#070913] px-3 py-1.5 rounded-lg border border-indigo-950">
          <span class="text-rose-400 text-base">💣</span>
          <span id="mineCountDisplay" class="font-mono text-indigo-100">000</span>
        </div>

        <button id="resetBtn" class="px-4 py-1.5 bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 rounded-lg text-xl active:scale-95 shadow">
          😎
        </button>

        <div class="flex items-center gap-1.5 bg-[#070913] px-3 py-1.5 rounded-lg border border-indigo-950">
          <span class="text-amber-400 text-base">⏱️</span>
          <span id="timerDisplay" class="font-mono text-amber-400">000</span>
        </div>
      </div>
    </div>

    <!-- Scrollable Board Viewport -->
    <div id="boardViewport" class="w-full flex justify-start sm:justify-center items-start overflow-auto p-4 border border-indigo-950/80 rounded-xl bg-[#03050c]/80 backdrop-blur-md shadow-inner">
      <div id="boardGrid" class="grid gap-1 bg-[#0b0f19] p-3 rounded-xl border border-indigo-900/50 shadow-2xl shrink-0"></div>
    </div>
  </main>

  <!-- MATCH RESULT OVERLAY MODAL -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#0b0f19] border border-indigo-900/80 rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4">
      <div id="resultEmoji" class="text-5xl">🏆</div>
      <div class="space-y-1">
        <h2 id="resultTitle" class="text-2xl font-black text-white">VICTORY!</h2>
        <p id="resultDesc" class="text-xs text-indigo-300/80">You cleared the board!</p>
      </div>
      
      <div class="bg-[#070913] border border-indigo-950 rounded-xl p-3 text-xs space-y-2 text-left">
        <div class="flex justify-between font-bold">
          <span class="text-indigo-300/70">Final Time:</span>
          <span id="statTime" class="text-amber-400 font-mono">0s</span>
        </div>
        <div class="flex justify-between font-bold">
          <span class="text-indigo-300/70">Personal Best:</span>
          <span id="statBest" class="text-emerald-400 font-mono">--</span>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="retryBtn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl text-xs uppercase tracking-wider shadow">
          Play Again ⏱️
        </button>
        <button id="menuBtn" class="flex-1 py-3 bg-indigo-950 hover:bg-indigo-900 border border-indigo-800 text-indigo-300 font-black rounded-xl text-xs uppercase tracking-wider shadow">
          Change Tier 🏠
        </button>
      </div>
    </div>
  </div>

  <div id="gameFooter" class="hidden fixed bottom-0 left-0 w-full bg-[#0b0f19]/95 border-t border-indigo-950 p-2 backdrop-blur z-30 flex justify-center">
    <div class="flex bg-[#070913] p-1 rounded-xl border border-indigo-900 shadow-inner w-full max-w-xs">
      <button id="modeDigBtn" class="flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-gradient-to-r from-amber-500 to-indigo-600 text-white shadow">
        <span>⛏️</span> DIG MODE
      </button>
      <button id="modeFlagBtn" class="flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-indigo-300 hover:text-white">
        <span>🚩</span> FLAG MODE
      </button>
    </div>
  </div>

  <script>
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'dig') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'flag') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const nOsc = audioCtx.createOscillator();
          const nGain = audioCtx.createGain();
          nOsc.connect(nGain); nGain.connect(audioCtx.destination);
          nOsc.type = 'sine';
          nOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
          nGain.gain.setValueAtTime(0.2, now + idx * 0.08);
          nGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
          nOsc.start(now + idx * 0.08); nOsc.stop(now + idx * 0.08 + 0.2);
        });
      }
    }

    let matchConfig = { type: 'beginner', rows: 9, cols: 9, mines: 10 };
    let board = [];
    let gameStatus = 'waiting';
    let firstClick = true;
    let flagsPlaced = 0;
    let isFlagMode = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    let touchTimer = null, touchStartX = 0, touchStartY = 0;
    let isLongPressTriggered = false;
    const LONG_PRESS_MS = 280, TOUCH_MOVE_THRESHOLD = 10;

    const presetSelect = document.getElementById('presetSelect');
    const customInputs = document.getElementById('customInputs');
    const startSpeedRunBtn = document.getElementById('startSpeedRunBtn');
    const lobbyContainer = document.getElementById('lobbyContainer');
    const gameMain = document.getElementById('gameMain');
    const gameFooter = document.getElementById('gameFooter');
    const boardGrid = document.getElementById('boardGrid');
    const mineCountDisplay = document.getElementById('mineCountDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const modeDigBtn = document.getElementById('modeDigBtn');
    const modeFlagBtn = document.getElementById('modeFlagBtn');
    const soundBtn = document.getElementById('soundBtn');
    const resultModal = document.getElementById('resultModal');
    const resultEmoji = document.getElementById('resultEmoji');
    const resultTitle = document.getElementById('resultTitle');
    const resultDesc = document.getElementById('resultDesc');
    const statTime = document.getElementById('statTime');
    const statBest = document.getElementById('statBest');
    const retryBtn = document.getElementById('retryBtn');
    const menuBtn = document.getElementById('menuBtn');

    presetSelect.onchange = () => {
      customInputs.classList.toggle('hidden', presetSelect.value !== 'custom');
    };

    startSpeedRunBtn.onclick = () => {
      const type = presetSelect.value;
      let r = 9, c = 9, m = 10;

      if (type === 'intermediate') { r = 16; c = 16; m = 40; }
      else if (type === 'expert') { r = 16; c = 30; m = 99; }
      else if (type === 'custom') {
        r = parseInt(document.getElementById('cRows').value) || 10;
        c = parseInt(document.getElementById('cCols').value) || 10;
        m = parseInt(document.getElementById('cMines').value) || 15;
      }

      matchConfig = { type, rows: r, cols: c, mines: m };
      
      lobbyContainer.classList.add('hidden');
      gameMain.classList.remove('hidden');
      gameFooter.classList.remove('hidden');
      resultModal.classList.add('hidden');
      initMatch();
    };

    retryBtn.onclick = () => {
      resultModal.classList.add('hidden');
      initMatch();
    };

    menuBtn.onclick = () => {
      resultModal.classList.add('hidden');
      gameMain.classList.add('hidden');
      gameFooter.classList.add('hidden');
      lobbyContainer.classList.remove('hidden');
    };

    function initMatch() {
      gameStatus = 'playing';
      firstClick = true;
      flagsPlaced = 0;
      secondsElapsed = 0;
      timerDisplay.innerText = '000';
      if (timerInterval) clearInterval(timerInterval);

      resetBtn.innerText = '😎';
      updateCounters();

      board = [];
      for (let r = 0; r < matchConfig.rows; r++) {
        let row = [];
        for (let c = 0; c < matchConfig.cols; c++) {
          row.push({ mine: false, revealed: false, flagged: false, count: 0 });
        }
        board.push(row);
      }

      renderGrid();
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (gameStatus === 'playing') {
          secondsElapsed++;
          if (secondsElapsed > 999) secondsElapsed = 999;
          timerDisplay.innerText = String(secondsElapsed).padStart(3, '0');
        }
      }, 1000);
    }

    function updateCellView(r, c) {
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) return;
      const cell = board[r][c];

      if (cell.revealed) {
        if (cell.count === 0) {
          el.className = 'ms-cell ms-revealed-zero rounded-lg flex items-center justify-center';
          el.innerHTML = '';
        } else {
          el.className = 'ms-cell ms-revealed-num rounded-lg flex items-center justify-center';
          el.innerHTML = `<span class="num-${cell.count}">${cell.count}</span>`;
        }
      } else if (cell.flagged) {
        el.className = 'ms-cell ms-unrevealed rounded-lg flex items-center justify-center';
        el.innerText = '🚩';
      } else {
        el.className = 'ms-cell ms-unrevealed rounded-lg flex items-center justify-center';
        el.innerText = '';
      }
    }

    function renderGrid() {
      boardGrid.style.gridTemplateColumns = `repeat(${matchConfig.cols}, minmax(40px, 1fr))`;
      boardGrid.innerHTML = '';

      for (let r = 0; r < matchConfig.rows; r++) {
        for (let c = 0; c < matchConfig.cols; c++) {
          const cellEl = document.createElement('button');
          cellEl.id = `cell-${r}-${c}`;
          boardGrid.appendChild(cellEl);
          updateCellView(r, c);

          cellEl.addEventListener('touchstart', (e) => handleTouchStart(e, r, c), { passive: false });
          cellEl.addEventListener('touchmove', (e) => handleTouchMove(e), { passive: true });
          cellEl.addEventListener('touchend', (e) => handleTouchEnd(e, r, c));
          cellEl.addEventListener('click', () => handleCellClick(r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
        }
      }
    }

    function generateMines(safeR, safeC) {
      let placed = 0;
      while (placed < matchConfig.mines) {
        let r = Math.floor(Math.random() * matchConfig.rows);
        let c = Math.floor(Math.random() * matchConfig.cols);

        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;

        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }
      recalculateCounts();
    }

    function recalculateCounts() {
      for (let r = 0; r < matchConfig.rows; r++) {
        for (let c = 0; c < matchConfig.cols; c++) {
          if (board[r][c].mine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < matchConfig.rows && nc >= 0 && nc < matchConfig.cols) {
                if (board[nr][nc].mine) cnt++;
              }
            }
          }
          board[r][c].count = cnt;
          if (board[r][c].revealed) updateCellView(r, c);
        }
      }
    }

    function handleCellClick(r, c) {
      if (gameStatus !== 'playing') return;
      if (isFlagMode) return toggleFlag(r, c);
      digCell(r, c);
    }

    function digCell(r, c) {
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        generateMines(r, c);
        startTimer();
      }

      if (cell.mine) {
        gameOver(false, '💥 You hit a mine!');
        return;
      }

      playSound('dig');
      revealCell(r, c);
      checkWinCondition();
    }

    function revealCell(r, c) {
      if (r < 0 || r >= matchConfig.rows || c < 0 || c >= matchConfig.cols) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      updateCellView(r, c);

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dr !== 0) revealCell(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameStatus !== 'playing') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        generateMines(r, c);
        startTimer();
      }

      cell.flagged = !cell.flagged;
      flagsPlaced += cell.flagged ? 1 : -1;
      playSound('flag');

      updateCellView(r, c);
      updateCounters();
    }

    function checkWinCondition() {
      let safeLeft = 0;
      for (let r = 0; r < matchConfig.rows; r++) {
        for (let c = 0; c < matchConfig.cols; c++) {
          if (!board[r][c].mine && !board[r][c].revealed) safeLeft++;
        }
      }

      if (safeLeft === 0) {
        gameOver(true, '🎉 Board cleared successfully!');
      }
    }

    function gameOver(isWin, msg) {
      if (timerInterval) clearInterval(timerInterval);
      gameStatus = isWin ? 'won' : 'lost';
      resetBtn.innerText = isWin ? '😎🏆' : '😵';
      playSound(isWin ? 'win' : 'explode');

      const storageKey = `ms_speed_${matchConfig.type}`;
      let bestTime = localStorage.getItem(storageKey);
      if (isWin) {
        if (!bestTime || secondsElapsed < parseInt(bestTime)) {
          bestTime = secondsElapsed;
          localStorage.setItem(storageKey, bestTime);
        }
      }

      statTime.innerText = `${secondsElapsed}s`;
      statBest.innerText = bestTime ? `${bestTime}s` : '--';

      resultEmoji.innerText = isWin ? '🏆' : '💀';
      resultTitle.innerText = isWin ? 'VICTORY!' : 'DEFEAT';
      resultTitle.className = `text-2xl font-black ${isWin ? 'text-emerald-400' : 'text-rose-500'}`;
      resultDesc.innerText = msg;
      resultModal.classList.remove('hidden');

      for (let r = 0; r < matchConfig.rows; r++) {
        for (let c = 0; c < matchConfig.cols; c++) {
          const cell = board[r][c];
          const el = document.getElementById(`cell-${r}-${c}`);
          if (cell.mine && el) {
            el.className = 'ms-cell rounded-lg flex items-center justify-center bg-rose-950/90 border border-rose-600';
            el.innerText = '💣';
          }
        }
      }
    }

    function updateCounters() {
      mineCountDisplay.innerText = String(Math.max(0, matchConfig.mines - flagsPlaced)).padStart(3, '0');
    }

    function handleTouchStart(e, r, c) {
      initAudio();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isLongPressTriggered = false;

      const el = document.getElementById(`cell-${r}-${c}`);
      if (el && !board[r][c].revealed) el.classList.add('ms-pressing');

      touchTimer = setTimeout(() => {
        isLongPressTriggered = true;
        if (el) el.classList.remove('ms-pressing');
        toggleFlag(r, c);
      }, LONG_PRESS_MS);
    }

    function handleTouchMove(e) {
      if (!touchTimer) return;
      if (Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY) > TOUCH_MOVE_THRESHOLD) {
        clearTimeout(touchTimer); touchTimer = null;
        document.querySelectorAll('.ms-pressing').forEach(el => el.classList.remove('ms-pressing'));
      }
    }

    function handleTouchEnd(e, r, c) {
      if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
      document.querySelectorAll('.ms-pressing').forEach(el => el.classList.remove('ms-pressing'));
      if (isLongPressTriggered) e.preventDefault();
    }

    modeDigBtn.onclick = () => {
      isFlagMode = false;
      modeDigBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-gradient-to-r from-amber-500 to-indigo-600 text-white shadow";
      modeFlagBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-indigo-300 hover:text-white";
    };

    modeFlagBtn.onclick = () => {
      isFlagMode = true;
      modeFlagBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-gradient-to-r from-amber-500 to-indigo-600 text-white shadow";
      modeDigBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-indigo-300 hover:text-white";
    };

    resetBtn.onclick = () => {
      initMatch();
    };

    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
    };
  </script>
</body>
</html>
