<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper - 100 Level Shape Campaign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: manipulation; -webkit-touch-callout: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #222f43; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #33435c; }

    /* Dynamic Cell Sizing */
    .ms-cell {
      width: var(--cell-size, 42px);
      height: var(--cell-size, 42px);
      min-width: var(--cell-size, 42px);
      min-height: var(--cell-size, 42px);
      font-weight: 800;
      font-size: calc(var(--cell-size, 42px) * 0.5);
      user-select: none;
      transition: background-color 0.1s, transform 0.05s, border-color 0.1s;
    }

    /* Cell Styles */
    .ms-unrevealed {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-top: 2px solid #334155;
      border-left: 2px solid #334155;
      border-right: 2px solid #020617;
      border-bottom: 2px solid #020617;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    
    .ms-unrevealed:active {
      transform: scale(0.94);
      background: #0f172a;
    }

    .ms-pressing {
      background: #7c3aed !important;
      border-color: #c084fc !important;
      box-shadow: 0 0 12px #c084fc !important;
      transform: scale(0.92);
    }

    .ms-revealed-zero {
      background: #070a12;
      border: 1px solid #111827;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
    }

    .ms-revealed-num {
      background: #0d1322;
      border: 1px solid #1e293b;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
    }

    /* Void/Blocked Void Cells */
    .ms-void {
      width: var(--cell-size, 42px);
      height: var(--cell-size, 42px);
      min-width: var(--cell-size, 42px);
      min-height: var(--cell-size, 42px);
      visibility: hidden;
      pointer-events: none;
    }

    .num-1 { color: #38bdf8; }
    .num-2 { color: #4ade80; }
    .num-3 { color: #f87171; }
    .num-4 { color: #c084fc; }
    .num-5 { color: #fbbf24; }
    .num-6 { color: #2dd4bf; }
    .num-7 { color: #f472b6; }
    .num-8 { color: #94a3b8; }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden">

  <!-- Header Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shadow-lg z-20 shrink-0">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition" title="Back to Classic Mode">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </a>
      <div>
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-amber-400">
          🧩 PUZZLE CAMPAIGN
        </h1>
        <p class="text-xs text-slate-400 font-medium">100 Unique Level Shapes</p>
      </div>
    </div>

    <!-- Quick Buttons -->
    <div class="flex items-center gap-2">
      <button id="levelSelectBtn" class="px-3 py-1.5 rounded-lg bg-purple-900/60 hover:bg-purple-800/80 border border-purple-500/40 text-purple-200 text-xs font-bold transition flex items-center gap-1.5">
        <span>🗺️</span> Levels
      </button>
      <button id="soundBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-400 transition" title="Toggle Sound">
        <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
        <svg id="soundOffIcon" class="w-5 h-5 hidden text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>
    </div>
  </header>

  <!-- Level Progress Status & Scoreboard -->
  <main class="flex-1 flex flex-col items-center justify-start p-2 max-w-full overflow-hidden min-h-0">
    
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-2.5 mb-2 shadow-md space-y-2 shrink-0">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Current Stage</span>
          <span id="levelTitleDisplay" class="text-sm font-black text-amber-400">Level 1: The Ring</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-lg transition active:scale-95 shadow">
            😎
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs font-bold">
        <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800">
          <span class="text-red-400">💣</span>
          <span id="mineCountDisplay" class="font-mono text-slate-200">000</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800">
          <span class="text-purple-400">⏱️</span>
          <span id="timerDisplay" class="font-mono text-purple-300">000s</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800">
          <span class="text-emerald-400">🔍</span>
          <span id="safeLeftDisplay" class="font-mono text-emerald-300">00</span>
        </div>
      </div>
    </div>

    <!-- Scrollable Board Viewport -->
    <div id="boardViewport" class="w-full flex-1 min-h-[55vh] flex justify-center items-center overflow-auto p-2 border border-slate-900/50 rounded-xl bg-slate-950/40 backdrop-blur-sm shadow-inner">
      <div id="boardGrid" class="grid gap-1 bg-slate-900 p-3 rounded-xl border border-slate-800/80 shadow-2xl">
        <!-- Cells Injected via JS -->
      </div>
    </div>

  </main>

  <!-- Mobile Mode Bar -->
  <div class="sticky bottom-0 w-full bg-slate-900/95 border-t border-slate-800 p-2.5 backdrop-blur z-20 flex justify-center shrink-0">
    <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 shadow-inner w-full max-w-xs">
      <button id="modeDigBtn" class="flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-purple-600 text-white shadow">
        <span>⛏️</span> DIG MODE
      </button>
      <button id="modeFlagBtn" class="flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200">
        <span>🚩</span> FLAG MODE
      </button>
    </div>
  </div>

  <!-- Level Select Modal -->
  <div id="levelModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 shadow-2xl relative space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-lg font-black text-purple-400 flex items-center gap-2">
          <span>🗺️</span> Campaign Map (100 Levels)
        </h2>
        <button id="closeLevelModalBtn" class="text-slate-400 hover:text-white p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="levelGridContainer" class="grid grid-cols-5 sm:grid-cols-10 gap-2 overflow-y-auto p-1 flex-1"></div>
    </div>
  </div>

  <script>
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'dig') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'flag') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(350, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const nOsc = audioCtx.createOscillator();
          const nGain = audioCtx.createGain();
          nOsc.connect(nGain); nGain.connect(audioCtx.destination);
          nOsc.type = 'sine';
          nOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
          nGain.gain.setValueAtTime(0.2, now + idx * 0.08);
          nGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
          nOsc.start(now + idx * 0.08); nOsc.stop(now + idx * 0.08 + 0.2);
        });
      }
    }

    let currentLevel = 1;
    let campaignData = JSON.parse(localStorage.getItem('ms_puzzle_data')) || {
      unlockedLevel: 1,
      completedLevels: []
    };

    function saveCampaignData() {
      localStorage.setItem('ms_puzzle_data', JSON.stringify(campaignData));
    }

    function generateLevelShape(lvl) {
      let rows = Math.min(18, 8 + Math.floor(lvl / 10));
      let cols = Math.min(18, 8 + Math.floor(lvl / 10));
      let grid = [];

      let shapeNames = [
        'Ring Donut', 'Plus Cross', 'Hourglass', 'Diamond', 'Corner L', 
        'Twin Towers', 'Target Bullseye', 'Chevrons', 'Maze Fortress', 'Fractured Star'
      ];
      let name = shapeNames[(lvl - 1) % shapeNames.length] + ` (Lvl ${lvl})`;

      for (let r = 0; r < rows; r++) {
        let row = [];
        for (let c = 0; c < cols; c++) {
          let valid = true;
          let nx = (c / (cols - 1)) * 2 - 1;
          let ny = (r / (rows - 1)) * 2 - 1;
          let dist = Math.hypot(nx, ny);

          const shapeType = (lvl - 1) % 10;
          
          switch (shapeType) {
            case 0: if (dist < 0.35 || dist > 0.95) valid = false; break;
            case 1: if (Math.abs(nx) > 0.4 && Math.abs(ny) > 0.4) valid = false; break;
            case 2: if (Math.abs(nx) > Math.abs(ny) + 0.2) valid = false; break;
            case 3: if (Math.abs(nx) + Math.abs(ny) > 1.1) valid = false; break;
            case 4: if (nx > 0.1 && ny < -0.1) valid = false; break;
            case 5: if (Math.abs(nx) < 0.25 && Math.abs(ny) < 0.7) valid = false; break;
            case 6: if (dist > 0.9 || (dist > 0.35 && dist < 0.6)) valid = false; break;
            case 7: if ((Math.floor((r + c) / 2) % 2 === 0) && (r < 2 || r > rows - 3)) valid = false; break;
            case 8: if ((r % 3 === 0 && c % 3 === 0) || (r === 0 || c === 0 || r === rows-1 || c === cols-1)) valid = false; break;
            case 9: if (dist > 0.95 || (Math.abs(nx * ny) < 0.05 && dist > 0.4)) valid = false; break;
          }
          row.push(valid);
        }
        grid.push(row);
      }

      let activeCount = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c]) activeCount++;
        }
      }

      let mineRatio = Math.min(0.22, 0.12 + (lvl * 0.001));
      let mineCount = Math.max(3, Math.floor(activeCount * mineRatio));

      return { rows, cols, grid, mineCount, activeCount, name };
    }

    let levelConfig = null;
    let board = [];
    let gameStatus = 'ready';
    let firstClick = true;
    let flagsPlaced = 0;
    let isFlagMode = false;
    let timer = 0;
    let timerInterval = null;

    let touchTimer = null;
    let touchStartX = 0, touchStartY = 0;
    let isLongPressTriggered = false;
    const LONG_PRESS_MS = 280;
    const TOUCH_MOVE_THRESHOLD = 10;

    const boardGrid = document.getElementById('boardGrid');
    const boardViewport = document.getElementById('boardViewport');
    const levelTitleDisplay = document.getElementById('levelTitleDisplay');
    const mineCountDisplay = document.getElementById('mineCountDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const safeLeftDisplay = document.getElementById('safeLeftDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const modeDigBtn = document.getElementById('modeDigBtn');
    const modeFlagBtn = document.getElementById('modeFlagBtn');
    const levelSelectBtn = document.getElementById('levelSelectBtn');
    const levelModal = document.getElementById('levelModal');
    const closeLevelModalBtn = document.getElementById('closeLevelModalBtn');
    const levelGridContainer = document.getElementById('levelGridContainer');
    const soundBtn = document.getElementById('soundBtn');

    function updateCellSizing() {
      if (!boardViewport || !levelConfig) return;
      const availWidth = boardViewport.clientWidth - 32;
      const availHeight = boardViewport.clientHeight - 32;

      const sizeFromWidth = Math.floor(availWidth / levelConfig.cols);
      const sizeFromHeight = Math.floor(availHeight / levelConfig.rows);
      
      let calculatedSize = Math.min(sizeFromWidth, sizeFromHeight);
      calculatedSize = Math.max(34, Math.min(64, calculatedSize));

      document.documentElement.style.setProperty('--cell-size', `${calculatedSize}px`);
    }

    window.addEventListener('resize', updateCellSizing);

    function loadLevel(lvlNum) {
      currentLevel = lvlNum;
      levelConfig = generateLevelShape(lvlNum);
      levelTitleDisplay.innerText = levelConfig.name;
      updateCellSizing();
      resetGame();
    }

    function resetGame() {
      clearInterval(timerInterval);
      gameStatus = 'ready';
      firstClick = true;
      flagsPlaced = 0;
      timer = 0;

      resetBtn.innerText = '😎';
      timerDisplay.innerText = '000s';
      updateCounters();

      board = [];
      for (let r = 0; r < levelConfig.rows; r++) {
        let row = [];
        for (let c = 0; c < levelConfig.cols; c++) {
          row.push({
            active: levelConfig.grid[r][c],
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          });
        }
        board.push(row);
      }

      renderBoard();
    }

    function renderBoard() {
      updateCellSizing();
      boardGrid.style.gridTemplateColumns = `repeat(${levelConfig.cols}, minmax(0, 1fr))`;
      boardGrid.innerHTML = '';

      for (let r = 0; r < levelConfig.rows; r++) {
        for (let c = 0; c < levelConfig.cols; c++) {
          const cellData = board[r][c];
          const cellEl = document.createElement('button');
          cellEl.id = `cell-${r}-${c}`;

          if (!cellData.active) {
            cellEl.className = 'ms-void';
          } else {
            cellEl.className = 'ms-cell ms-unrevealed rounded-lg flex items-center justify-center';
            
            cellEl.addEventListener('touchstart', (e) => handleTouchStart(e, r, c), { passive: false });
            cellEl.addEventListener('touchmove', (e) => handleTouchMove(e), { passive: true });
            cellEl.addEventListener('touchend', (e) => handleTouchEnd(e, r, c));
            cellEl.addEventListener('click', () => handleCellClick(r, c));
            cellEl.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              toggleFlag(r, c);
            });
          }

          boardGrid.appendChild(cellEl);
        }
      }
    }

    function generateMines(safeR, safeC) {
      let placed = 0;

      while (placed < levelConfig.mineCount) {
        let r = Math.floor(Math.random() * levelConfig.rows);
        let c = Math.floor(Math.random() * levelConfig.cols);

        if (!board[r][c].active) continue;
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;

        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }

      for (let r = 0; r < levelConfig.rows; r++) {
        for (let c = 0; c < levelConfig.cols; c++) {
          if (!board[r][c].active || board[r][c].mine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < levelConfig.rows && nc >= 0 && nc < levelConfig.cols) {
                if (board[nr][nc].active && board[nr][nc].mine) cnt++;
              }
            }
          }
          board[r][c].count = cnt;
        }
      }
    }

    function handleCellClick(r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      if (isFlagMode) {
        toggleFlag(r, c);
        return;
      }
      digCell(r, c);
    }

    function digCell(r, c) {
      const cell = board[r][c];
      if (!cell.active || cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        generateMines(r, c);
        startTimer();
      }

      if (cell.mine) {
        gameOver(false);
        return;
      }

      playSound('dig');
      revealCell(r, c);
      checkWinCondition();
    }

    function revealCell(r, c) {
      if (r < 0 || r >= levelConfig.rows || c < 0 || c >= levelConfig.cols) return;
      const cell = board[r][c];
      if (!cell.active || cell.revealed || cell.flagged) return;

      cell.revealed = true;
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) return;

      el.classList.remove('ms-unrevealed');

      if (cell.count === 0) {
        el.classList.add('ms-revealed-zero');
        el.innerHTML = '';
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) revealCell(r + dr, c + dc);
          }
        }
      } else {
        el.classList.add('ms-revealed-num');
        el.innerHTML = `<span class="num-${cell.count}">${cell.count}</span>`;
      }
    }

    function toggleFlag(r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      const cell = board[r][c];
      if (!cell.active || cell.revealed) return;

      cell.flagged = !cell.flagged;
      flagsPlaced += cell.flagged ? 1 : -1;
      playSound('flag');

      const el = document.getElementById(`cell-${r}-${c}`);
      if (el) el.innerText = cell.flagged ? '🚩' : '';

      if (navigator.vibrate) navigator.vibrate(40);
      updateCounters();
    }

    function handleTouchStart(e, r, c) {
      initAudio();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isLongPressTriggered = false;

      const el = document.getElementById(`cell-${r}-${c}`);
      if (el && !board[r][c].revealed) el.classList.add('ms-pressing');

      touchTimer = setTimeout(() => {
        isLongPressTriggered = true;
        if (el) el.classList.remove('ms-pressing');
        toggleFlag(r, c);
      }, LONG_PRESS_MS);
    }

    function handleTouchMove(e) {
      if (!touchTimer) return;
      const moveX = e.touches[0].clientX;
      const moveY = e.touches[0].clientY;
      if (Math.hypot(moveX - touchStartX, moveY - touchStartY) > TOUCH_MOVE_THRESHOLD) {
        clearTimeout(touchTimer);
        touchTimer = null;
        document.querySelectorAll('.ms-pressing').forEach(el => el.classList.remove('ms-pressing'));
      }
    }

    function handleTouchEnd(e, r, c) {
      if (touchTimer) {
        clearTimeout(touchTimer);
        touchTimer = null;
      }
      document.querySelectorAll('.ms-pressing').forEach(el => el.classList.remove('ms-pressing'));
      if (isLongPressTriggered) e.preventDefault();
    }

    function startTimer() {
      gameStatus = 'playing';
      timerInterval = setInterval(() => {
        timer++;
        timerDisplay.innerText = String(timer).padStart(3, '0') + 's';
      }, 1000);
    }

    function updateCounters() {
      mineCountDisplay.innerText = String(levelConfig.mineCount - flagsPlaced).padStart(3, '0');

      let unrevealedSafe = 0;
      for (let r = 0; r < levelConfig.rows; r++) {
        for (let c = 0; c < levelConfig.cols; c++) {
          if (board[r][c].active && !board[r][c].mine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      safeLeftDisplay.innerText = String(unrevealedSafe).padStart(2, '0');
    }

    function checkWinCondition() {
      updateCounters();
      let unrevealedSafe = 0;
      for (let r = 0; r < levelConfig.rows; r++) {
        for (let c = 0; c < levelConfig.cols; c++) {
          if (board[r][c].active && !board[r][c].mine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }

      if (unrevealedSafe === 0) gameOver(true);
    }

    function gameOver(isWin) {
      clearInterval(timerInterval);

      if (isWin) {
        gameStatus = 'won';
        resetBtn.innerText = '😎🏆';
        playSound('win');

        if (!campaignData.completedLevels.includes(currentLevel)) {
          campaignData.completedLevels.push(currentLevel);
        }

        if (currentLevel === campaignData.unlockedLevel && currentLevel < 100) {
          campaignData.unlockedLevel = currentLevel + 1;
        }

        saveCampaignData();

        setTimeout(() => {
          if (currentLevel < 100) {
            if (confirm(`🎉 LEVEL ${currentLevel} CLEARED!\nWould you like to proceed to Level ${currentLevel + 1}?`)) {
              loadLevel(currentLevel + 1);
            }
          } else {
            alert('🌟 CONGRATULATIONS! YOU BEAT ALL 100 PUZZLE LEVELS!');
          }
        }, 150);

      } else {
        gameStatus = 'lost';
        resetBtn.innerText = '😵';
        playSound('explode');

        for (let r = 0; r < levelConfig.rows; r++) {
          for (let c = 0; c < levelConfig.cols; c++) {
            const cell = board[r][c];
            const el = document.getElementById(`cell-${r}-${c}`);
            if (cell.active && cell.mine && el) {
              el.classList.remove('ms-unrevealed');
              el.classList.add('bg-rose-950/90', 'border-rose-600');
              el.innerText = '💣';
            }
          }
        }
      }
    }

    levelSelectBtn.onclick = () => {
      levelGridContainer.innerHTML = '';

      for (let i = 1; i <= 100; i++) {
        const isUnlocked = i <= campaignData.unlockedLevel;
        const isCompleted = campaignData.completedLevels.includes(i);
        const isCurrent = i === currentLevel;

        const btn = document.createElement('button');
        btn.className = `p-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition border ${
          isCurrent ? 'bg-purple-600 text-white border-purple-400 ring-2 ring-purple-300' :
          isCompleted ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300 hover:bg-emerald-900' :
          isUnlocked ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' :
          'bg-slate-950 border-slate-900 text-slate-600 opacity-50 cursor-not-allowed'
        }`;

        btn.innerHTML = `
          <span>Lvl ${i}</span>
          <span class="text-[10px]">${isCompleted ? '✅' : (isUnlocked ? '🔓' : '🔒')}</span>
        `;

        if (isUnlocked) {
          btn.onclick = () => {
            loadLevel(i);
            levelModal.classList.add('hidden');
          };
        }

        levelGridContainer.appendChild(btn);
      }

      levelModal.classList.remove('hidden');
    };

    closeLevelModalBtn.onclick = () => levelModal.classList.add('hidden');

    modeDigBtn.onclick = () => {
      isFlagMode = false;
      modeDigBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-purple-600 text-white shadow";
      modeFlagBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200";
    };

    modeFlagBtn.onclick = () => {
      isFlagMode = true;
      modeFlagBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition bg-purple-600 text-white shadow";
      modeDigBtn.className = "flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200";
    };

    resetBtn.onclick = resetGame;

    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
    };

    loadLevel(campaignData.unlockedLevel || 1);
  </script>
</body>
</html>
