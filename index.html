<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper - Premium Web Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            950: '#0b0f19'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Touch prevent default selections and gestures */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* Fixed cell styling with 3D button effect */
        .ms-cell {
            width: 38px;
            height: 38px;
            min-width: 38px;
            min-height: 38px;
            box-sizing: border-box;
        }

        /* Modern untouched tile design */
        .cell-unrevealed {
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 2px solid;
            border-color: #475569 #0f172a #0f172a #475569;
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.15);
        }
        .cell-unrevealed:active {
            background: #1e293b;
            border-color: #0f172a;
        }

        /* Revealed Empty Zero (0) Cell Styling */
        .cell-revealed-zero {
            background-color: #0b0f19 !important;
            border: 1px solid #1e293b !important;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.8) !important;
        }

        /* Revealed Number Cell Styling */
        .cell-revealed-num {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5) !important;
        }

        /* Digital LED font styling */
        .digital-font {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
        }

        /* Classic Minesweeper Number Colors */
        .num-1 { color: #3b82f6; } /* Blue */
        .num-2 { color: #22c55e; } /* Green */
        .num-3 { color: #ef4444; } /* Red */
        .num-4 { color: #1e40af; } /* Dark Blue */
        .num-5 { color: #991b1b; } /* Maroon */
        .num-6 { color: #06b6d4; } /* Teal */
        .num-7 { color: #000000; text-shadow: 0 0 2px #ffffff; } /* Black */
        .num-8 { color: #9ca3af; } /* Gray */

        /* Animation effects */
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Custom Scrollbars for board container */
        .board-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .board-scroll::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .board-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col font-sans transition-colors duration-200 overflow-x-hidden">

    <!-- Top Navigation Header -->
    <header class="w-full bg-slate-800/90 backdrop-blur border-b border-slate-700/60 px-4 py-3 sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <!-- App Logo / Title -->
            <div class="flex items-center space-x-2.5">
                <div class="bg-red-500/20 text-red-500 p-2 rounded-xl border border-red-500/30">
                    <i class="fa-solid fa-land-mine-on text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">MINESWEEPER</h1>
                    <p class="text-xs text-slate-400">Ad-Free • Touch Optimized</p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center space-x-2">
                <button id="btn-sound" class="p-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors" title="Toggle Sound">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-base"></i>
                </button>
                <button id="btn-stats" class="p-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors" title="Statistics">
                    <i class="fa-solid fa-trophy text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-start p-2 sm:p-4 max-w-5xl mx-auto w-full">

        <!-- Mode Ribbon -->
        <div class="w-full max-w-2xl flex flex-wrap items-center justify-between gap-2 mb-3 bg-slate-800/60 p-2 rounded-2xl border border-slate-700/60 shadow-lg">
            <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                <button data-diff="beginner" class="btn-diff px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow transition-all whitespace-nowrap">
                    Beginner (9x9)
                </button>
                <button data-diff="intermediate" class="btn-diff px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    Intermediate (16x16)
                </button>
                <button data-diff="expert" class="btn-diff px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    Expert (16x30)
                </button>
                <button data-diff="custom" class="btn-diff px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    Custom
                </button>
            </div>

            <button id="btn-reset" class="hidden sm:flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-colors">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Reset</span>
            </button>
        </div>

        <!-- Scoreboard Header -->
        <div class="w-full max-w-2xl bg-slate-800 rounded-t-2xl border-t border-x border-slate-700 p-3 flex items-center justify-between shadow-xl">
            <!-- Mine Counter -->
            <div class="flex items-center bg-slate-950 px-3.5 py-1.5 rounded-xl border border-slate-800 space-x-2">
                <i class="fa-solid fa-flag text-amber-500 text-sm"></i>
                <span id="mine-count" class="digital-font text-red-500 text-2xl font-bold w-12 text-right">010</span>
            </div>

            <!-- Face Button -->
            <button id="btn-face" class="w-12 h-12 rounded-full bg-slate-700 border-2 border-slate-600 flex items-center justify-center text-2xl hover:scale-105 active:scale-95 transition-transform shadow-lg">
                <span id="face-icon">😊</span>
            </button>

            <!-- Timer -->
            <div class="flex items-center bg-slate-950 px-3.5 py-1.5 rounded-xl border border-slate-800 space-x-2">
                <i class="fa-solid fa-stopwatch text-blue-400 text-sm"></i>
                <span id="timer-count" class="digital-font text-red-500 text-2xl font-bold w-12 text-right">000</span>
            </div>
        </div>

        <!-- Roaming Pan / Scroll Container -->
        <div id="board-container" class="board-scroll w-full max-w-2xl bg-slate-950 rounded-b-2xl border border-slate-700 p-3 overflow-auto flex items-start justify-center min-h-[320px] max-h-[62vh] shadow-2xl relative cursor-grab active:cursor-grabbing">
            <div id="minesweeper-board" class="grid gap-1 m-auto"></div>
        </div>

        <!-- Floating Mobile Controls -->
        <div class="mt-4 flex items-center justify-center space-x-3 w-full max-w-xs">
            <button id="btn-mode-dig" class="flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-blue-500 bg-blue-600 text-white shadow-lg transition-all">
                <i class="fa-solid fa-shovel text-sm"></i>
                <span>DIG MODE</span>
            </button>
            <button id="btn-mode-flag" class="flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-slate-700 bg-slate-800 text-slate-400 shadow-lg transition-all">
                <i class="fa-solid fa-flag text-sm"></i>
                <span>FLAG MODE</span>
            </button>
        </div>
        <p class="text-xs text-slate-400 mt-2 text-center">
            Tip: Long-press to flag. Tap revealed numbers for quick chording.
        </p>
    </main>

    <!-- Custom Modal -->
    <div id="modal-custom" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-xs shadow-2xl pop-in">
            <h3 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-400"></i> Custom Setup
            </h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Rows (5 - 30)</label>
                    <input type="number" id="custom-rows" value="12" min="5" max="30" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Columns (5 - 30)</label>
                    <input type="number" id="custom-cols" value="12" min="5" max="30" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mines</label>
                    <input type="number" id="custom-mines" value="20" min="1" max="300" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button id="btn-custom-cancel" class="px-4 py-2 rounded-xl bg-slate-700 text-slate-300 text-xs font-bold hover:bg-slate-600 transition-colors">Cancel</button>
                <button id="btn-custom-apply" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold hover:bg-blue-500 transition-colors">Apply</button>
            </div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="modal-stats" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl pop-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-400"></i> Game Statistics
                </h3>
                <button id="btn-stats-close" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Board selector dropdown for stats -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Select Configuration:</label>
                <select id="stats-config-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                </select>
            </div>

            <!-- Stats grid -->
            <div class="grid grid-cols-2 gap-2 text-center mb-4">
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-played" class="text-xl font-bold text-slate-100">0</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Played</div>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-winrate" class="text-xl font-bold text-emerald-400">0%</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Win Rate</div>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-best" class="text-xl font-bold text-amber-400">--</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Best Time</div>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-avg" class="text-xl font-bold text-blue-400">--</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Avg Time</div>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-streak" class="text-xl font-bold text-purple-400">0</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Current Streak</div>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div id="stat-maxstreak" class="text-xl font-bold text-pink-400">0</div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">Max Streak</div>
                </div>
            </div>

            <button id="btn-clear-stats" class="w-full py-2.5 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold hover:bg-red-500/20 transition-colors">
                Reset Selected Stats
            </button>
        </div>
    </div>

    <!-- GameOver Modal -->
    <div id="modal-gameover" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl pop-in">
            <div id="gameover-icon" class="text-5xl mb-3">🎉</div>
            <h2 id="gameover-title" class="text-2xl font-bold text-slate-100 mb-1">VICTORY!</h2>
            <p id="gameover-message" class="text-xs text-slate-400 mb-4">You cleared all mines in 42 seconds!</p>
            
            <button id="btn-play-again" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg transition-all">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // Preset Configurations
        const PRESETS = {
            beginner: { rows: 9, cols: 9, mines: 10 },
            intermediate: { rows: 16, cols: 16, mines: 40 },
            expert: { rows: 16, cols: 30, mines: 99 },
            custom: { rows: 12, cols: 12, mines: 20 }
        };

        // State Variables
        let currentDifficulty = 'beginner';
        let config = { ...PRESETS.beginner };
        let board = [];
        let isFirstClick = true;
        let isGameOver = false;
        let activeMode = 'dig'; // 'dig' or 'flag'
        let timer = 0;
        let timerInterval = null;
        let flagsPlaced = 0;
        let cellsRevealed = 0;
        let soundMuted = false;

        // Long Press Handler Parameters
        let longPressTimer = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let isLongPressTriggered = false;
        const LONG_PRESS_DURATION = 300; // ms
        const MOVE_THRESHOLD = 10; // px tolerance for finger tremor

        // DOM Element Cache
        const boardEl = document.getElementById('minesweeper-board');
        const boardContainer = document.getElementById('board-container');
        const mineCountEl = document.getElementById('mine-count');
        const timerCountEl = document.getElementById('timer-count');
        const faceIconEl = document.getElementById('face-icon');
        const btnFace = document.getElementById('btn-face');
        const btnReset = document.getElementById('btn-reset');
        const btnModeDig = document.getElementById('btn-mode-dig');
        const btnModeFlag = document.getElementById('btn-mode-flag');
        const modalGameOver = document.getElementById('modal-gameover');
        const modalCustom = document.getElementById('modal-custom');
        const modalStats = document.getElementById('modal-stats');
        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');

        // Web Audio Context Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playAudio(type) {
            if (soundMuted) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'dig') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'flag') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.06);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'chord') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'explode') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'win') {
                    const notes = [400, 500, 600, 800];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        noteGain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.1);
                        noteOsc.start(now + idx * 0.08);
                        noteOsc.stop(now + idx * 0.08 + 0.1);
                    });
                }
            } catch (e) {
                // Audio Context fallback handling
            }
        }

        // Haptic Feedback Helper
        function triggerHaptic(pattern = 30) {
            if ('vibrate' in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (e) {}
            }
        }

        // Initializer
        window.onload = function() {
            setupEventListeners();
            startNewGame();
        };

        // Setup Event Listeners
        function setupEventListeners() {
            document.querySelectorAll('.btn-diff').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const diff = e.currentTarget.dataset.diff;
                    setDifficulty(diff);
                });
            });

            btnFace.addEventListener('click', () => startNewGame());
            btnReset.addEventListener('click', () => startNewGame());
            document.getElementById('btn-play-again').addEventListener('click', () => {
                modalGameOver.classList.add('hidden');
                startNewGame();
            });

            btnModeDig.addEventListener('click', () => setTouchMode('dig'));
            btnModeFlag.addEventListener('click', () => setTouchMode('flag'));

            document.getElementById('btn-custom-cancel').addEventListener('click', () => modalCustom.classList.add('hidden'));
            document.getElementById('btn-custom-apply').addEventListener('click', applyCustomDifficulty);

            document.getElementById('btn-stats').addEventListener('click', showStatsModal);
            document.getElementById('btn-stats-close').addEventListener('click', () => modalStats.classList.add('hidden'));
            document.getElementById('btn-clear-stats').addEventListener('click', clearStatsForCurrentSelect);
            document.getElementById('stats-config-select').addEventListener('change', (e) => updateStatsDisplay(e.target.value));

            btnSound.addEventListener('click', () => {
                soundMuted = !soundMuted;
                soundIcon.className = soundMuted ? 'fa-solid fa-volume-xmark text-red-400' : 'fa-solid fa-volume-high text-base';
            });
        }

        // Change Active Preset
        function setDifficulty(diff) {
            document.querySelectorAll('.btn-diff').forEach(btn => {
                if (btn.dataset.diff === diff) {
                    btn.classList.replace('bg-slate-700', 'bg-blue-600');
                    btn.classList.replace('text-slate-300', 'text-white');
                } else {
                    btn.classList.replace('bg-blue-600', 'bg-slate-700');
                    btn.classList.replace('text-white', 'text-slate-300');
                }
            });

            currentDifficulty = diff;
            if (diff === 'custom') {
                modalCustom.classList.remove('hidden');
            } else {
                config = { ...PRESETS[diff] };
                startNewGame();
            }
        }

        // Custom Setup Apply
        function applyCustomDifficulty() {
            const rows = parseInt(document.getElementById('custom-rows').value) || 12;
            const cols = parseInt(document.getElementById('custom-cols').value) || 12;
            const maxMines = Math.floor(rows * cols * 0.8);
            let mines = parseInt(document.getElementById('custom-mines').value) || 20;
            mines = Math.min(Math.max(1, mines), maxMines);

            config = {
                rows: Math.min(Math.max(5, rows), 30),
                cols: Math.min(Math.max(5, cols), 30),
                mines: mines
            };

            PRESETS.custom = { ...config };
            modalCustom.classList.add('hidden');
            startNewGame();
        }

        // Toggle Touch Dig/Flag mode
        function setTouchMode(mode) {
            activeMode = mode;
            if (mode === 'dig') {
                btnModeDig.className = "flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-blue-500 bg-blue-600 text-white shadow-lg transition-all";
                btnModeFlag.className = "flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-slate-700 bg-slate-800 text-slate-400 shadow-lg transition-all";
            } else {
                btnModeFlag.className = "flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-amber-500 bg-amber-600 text-white shadow-lg transition-all";
                btnModeDig.className = "flex-1 py-3 px-4 rounded-xl font-extrabold text-xs flex items-center justify-center space-x-2 border-2 border-slate-700 bg-slate-800 text-slate-400 shadow-lg transition-all";
            }
        }

        // Reset & Initialize Game
        function startNewGame() {
            clearInterval(timerInterval);
            timer = 0;
            flagsPlaced = 0;
            cellsRevealed = 0;
            isFirstClick = true;
            isGameOver = false;

            updateTimerDisplay();
            updateMineDisplay();
            faceIconEl.textContent = '😊';

            createBoardData();
            renderBoard();
        }

        function createBoardData() {
            board = [];
            for (let r = 0; r < config.rows; r++) {
                const row = [];
                for (let c = 0; c < config.cols; c++) {
                    row.push({
                        r: r,
                        c: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    });
                }
                board.push(row);
            }
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${config.cols}, 38px)`;

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = board[r][c];
                    const cellEl = document.createElement('button');
                    cellEl.id = `cell-${r}-${c}`;
                    cellEl.className = `ms-cell cell-unrevealed rounded-lg font-extrabold text-base flex items-center justify-center select-none active:scale-95 transition-transform duration-75`;

                    attachCellEvents(cellEl, cell);
                    boardEl.appendChild(cellEl);
                }
            }
        }

        function attachCellEvents(el, cell) {
            // Context menu flag
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (isGameOver) return;
                toggleFlag(cell);
            });

            // Touch Handling with tremor-tolerant Long Press
            el.addEventListener('touchstart', (e) => {
                if (isGameOver) return;
                isLongPressTriggered = false;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;

                longPressTimer = setTimeout(() => {
                    isLongPressTriggered = true;
                    triggerHaptic(40);
                    toggleFlag(cell);
                }, LONG_PRESS_DURATION);
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
                if (!longPressTimer) return;
                const touch = e.touches[0];
                const dx = Math.abs(touch.clientX - touchStartX);
                const dy = Math.abs(touch.clientY - touchStartY);

                if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }, { passive: true });

            el.addEventListener('touchend', () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            });

            // Primary Tap/Click Action
            el.addEventListener('click', (e) => {
                if (isGameOver || isLongPressTriggered) {
                    isLongPressTriggered = false;
                    return;
                }

                if (cell.isRevealed) {
                    chordCell(cell);
                    return;
                }

                if (activeMode === 'flag') {
                    toggleFlag(cell);
                } else {
                    handleDig(cell);
                }
            });
        }

        function handleDig(cell) {
            if (cell.isFlagged || cell.isRevealed) return;

            if (isFirstClick) {
                isFirstClick = false;
                startTimer();
                generateMines(cell.r, cell.c);
            }

            if (cell.isMine) {
                detonateMine(cell);
                return;
            }

            playAudio('dig');
            revealCell(cell);
            checkWinCondition();
        }

        // Generate mines guaranteeing the first tap lands on a zero (0) cell
        function generateMines(safeR, safeC) {
            let minesToPlace = config.mines;
            while (minesToPlace > 0) {
                const r = Math.floor(Math.random() * config.rows);
                const c = Math.floor(Math.random() * config.cols);

                // Enforce safe 3x3 zone around first tap
                const isSafeZone = Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1;

                if (!board[r][c].isMine && !isSafeZone) {
                    board[r][c].isMine = true;
                    minesToPlace--;
                }
            }

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countNeighborMines(r, c);
                    }
                }
            }
        }

        function countNeighborMines(r, c) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                        if (board[nr][nc].isMine) count++;
                    }
                }
            }
            return count;
        }

        // Cascading Flood Fill Algorithm
        function revealCell(cell) {
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cellsRevealed++;

            const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
            el.classList.remove('cell-unrevealed');

            if (cell.neighborMines === 0) {
                el.classList.add('cell-revealed-zero');
                el.textContent = '';
                // Recursively reveal adjacent neighbors for 0 cells
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = cell.r + dr;
                        const nc = cell.c + dc;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                            const neighbor = board[nr][nc];
                            if (!neighbor.isRevealed) {
                                revealCell(neighbor);
                            }
                        }
                    }
                }
            } else {
                el.classList.add('cell-revealed-num', `num-${cell.neighborMines}`);
                el.textContent = cell.neighborMines;
            }
        }

        function toggleFlag(cell) {
            if (cell.isRevealed) return;

            cell.isFlagged = !cell.isFlagged;
            flagsPlaced += cell.isFlagged ? 1 : -1;

            const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
            if (cell.isFlagged) {
                el.innerHTML = '<i class="fa-solid fa-flag text-amber-500 pop-in text-sm"></i>';
                playAudio('flag');
            } else {
                el.innerHTML = '';
            }

            updateMineDisplay();
        }

        // Chording action
        function chordCell(cell) {
            if (!cell.isRevealed || cell.neighborMines === 0) return;

            let flaggedCount = 0;
            const neighbors = [];

            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = cell.r + dr;
                    const nc = cell.c + dc;
                    if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                        const neighbor = board[nr][nc];
                        neighbors.push(neighbor);
                        if (neighbor.isFlagged) flaggedCount++;
                    }
                }
            }

            if (flaggedCount === cell.neighborMines) {
                playAudio('chord');
                neighbors.forEach(n => {
                    if (!n.isFlagged && !n.isRevealed) {
                        handleDig(n);
                    }
                });
            }
        }

        function detonateMine(hitCell) {
            isGameOver = true;
            clearInterval(timerInterval);
            faceIconEl.textContent = '😵';
            playAudio('explode');
            triggerHaptic([100, 50, 100]);

            recordStat(getConfigKey(), false, timer);

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = board[r][c];
                    const el = document.getElementById(`cell-${r}-${c}`);

                    if (cell.isMine) {
                        el.classList.remove('cell-unrevealed');
                        el.classList.add('cell-revealed-num');
                        el.innerHTML = '<i class="fa-solid fa-land-mine-on text-red-500 text-base"></i>';
                        if (cell === hitCell) {
                            el.classList.add('bg-red-900/80', 'border-red-500');
                        }
                    } else if (cell.isFlagged) {
                        el.innerHTML = '<i class="fa-solid fa-xmark text-slate-400 text-base"></i>';
                    }
                }
            }

            setTimeout(() => showGameOverModal(false), 500);
        }

        function checkWinCondition() {
            const totalCells = config.rows * config.cols;
            if (cellsRevealed === totalCells - config.mines) {
                isGameOver = true;
                clearInterval(timerInterval);
                faceIconEl.textContent = '😎';
                playAudio('win');
                triggerHaptic([50, 100, 150]);

                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        const cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.isFlagged = true;
                            const el = document.getElementById(`cell-${r}-${c}`);
                            el.innerHTML = '<i class="fa-solid fa-flag text-amber-500 text-sm"></i>';
                        }
                    }
                }
                flagsPlaced = config.mines;
                updateMineDisplay();

                recordStat(getConfigKey(), true, timer);

                setTimeout(() => showGameOverModal(true), 400);
            }
        }

        function showGameOverModal(isWin) {
            const titleEl = document.getElementById('gameover-title');
            const msgEl = document.getElementById('gameover-message');
            const iconEl = document.getElementById('gameover-icon');

            if (isWin) {
                iconEl.textContent = '🏆';
                titleEl.textContent = 'VICTORY!';
                titleEl.className = 'text-2xl font-bold text-amber-400 mb-1';
                msgEl.textContent = `Cleared all mines in ${timer} seconds!`;
            } else {
                iconEl.textContent = '💥';
                titleEl.textContent = 'GAME OVER';
                titleEl.className = 'text-2xl font-bold text-red-500 mb-1';
                msgEl.textContent = 'You hit a mine. Better luck next time!';
            }

            modalGameOver.classList.remove('hidden');
        }

        function startTimer() {
            timer = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timer++;
                if (timer > 999) timer = 999;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            timerCountEl.textContent = String(timer).padStart(3, '0');
        }

        function updateMineDisplay() {
            const remaining = config.mines - flagsPlaced;
            mineCountEl.textContent = String(Math.max(-99, Math.min(999, remaining))).padStart(3, '0');
        }

        // Key generator per configuration
        function getConfigKey() {
            return `${config.rows}x${config.cols}x${config.mines}`;
        }

        // Stats Tracking via localStorage
        function recordStat(key, isWin, time) {
            const stats = JSON.parse(localStorage.getItem('ms_stats_v2') || '{}');
            if (!stats[key]) {
                stats[key] = {
                    played: 0,
                    wins: 0,
                    bestTime: null,
                    totalTime: 0,
                    currentStreak: 0,
                    maxStreak: 0
                };
            }

            const s = stats[key];
            s.played++;
            if (isWin) {
                s.wins++;
                s.totalTime += time;
                if (s.bestTime === null || time < s.bestTime) {
                    s.bestTime = time;
                }
                s.currentStreak++;
                if (s.currentStreak > s.maxStreak) {
                    s.maxStreak = s.currentStreak;
                }
            } else {
                s.currentStreak = 0;
            }

            localStorage.setItem('ms_stats_v2', JSON.stringify(stats));
        }

        function showStatsModal() {
            const stats = JSON.parse(localStorage.getItem('ms_stats_v2') || '{}');
            const selectEl = document.getElementById('stats-config-select');
            selectEl.innerHTML = '';

            const currentKey = getConfigKey();
            const keys = Object.keys(stats);
            if (!keys.includes(currentKey)) {
                keys.unshift(currentKey);
            }

            keys.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = getLabelForConfigKey(k);
                if (k === currentKey) opt.selected = true;
                selectEl.appendChild(opt);
            });

            updateStatsDisplay(selectEl.value);
            modalStats.classList.remove('hidden');
        }

        function getLabelForConfigKey(key) {
            if (key === '9x9x10') return 'Beginner (9x9 - 10 mines)';
            if (key === '16x16x40') return 'Intermediate (16x16 - 40 mines)';
            if (key === '16x30x99') return 'Expert (16x30 - 99 mines)';
            return `Custom (${key.replace(/x/g, ' × ')} mines)`;
        }

        function updateStatsDisplay(key) {
            const stats = JSON.parse(localStorage.getItem('ms_stats_v2') || '{}');
            const s = stats[key] || { played: 0, wins: 0, bestTime: null, totalTime: 0, currentStreak: 0, maxStreak: 0 };

            document.getElementById('stat-played').textContent = s.played;
            const winrate = s.played > 0 ? Math.round((s.wins / s.played) * 100) : 0;
            document.getElementById('stat-winrate').textContent = `${winrate}%`;
            document.getElementById('stat-best').textContent = s.bestTime !== null ? `${s.bestTime}s` : '--';
            const avg = s.wins > 0 ? Math.round(s.totalTime / s.wins) : '--';
            document.getElementById('stat-avg').textContent = avg !== '--' ? `${avg}s` : '--';
            document.getElementById('stat-streak').textContent = s.currentStreak;
            document.getElementById('stat-maxstreak').textContent = s.maxStreak;
        }

        function clearStatsForCurrentSelect() {
            const key = document.getElementById('stats-config-select').value;
            const stats = JSON.parse(localStorage.getItem('ms_stats_v2') || '{}');
            delete stats[key];
            localStorage.setItem('ms_stats_v2', JSON.stringify(stats));
            updateStatsDisplay(key);
        }
    </script>
